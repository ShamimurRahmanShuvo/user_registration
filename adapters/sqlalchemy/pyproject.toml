[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "user-registration-sqlalchemy"
version = "1.0.0"
description = "SQLAlchemy 2.x repository adapter for the framework-agnostic user-registration package."
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Md Shamimur Rahman Shuvo" }
]

keywords = [
    "python",
    "user-registration",
    "sqlalchemy",
    "database",
    "repository",
    "registration",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]

dependencies = [
    "user-registration>=1.0.0,<2.0.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/ShamimurRahmanShuvo/user_registration"
Repository = "https://github.com/ShamimurRahmanShuvo/user_registration"
Issues = "https://github.com/ShamimurRahmanShuvo/user_registration/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "mypy>=1.13",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["user_registration_sqlalchemy"]