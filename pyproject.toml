[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "user_registration"
version = "0.1.2"
description = "Framework-agnostic, extensible user registration for Python applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Md Shamimur Rahman Shuvo" }
]
keywords = [
    "user-registration",
    "authentication",
    "password",
    "security",
    "python",
    "users"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries"
]

dependencies = [
    "password-validator-s>=1.0.0,<2.0.0",
    "argon2-cffi>=23.1.0,<26.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.13",
    "build>=1.2",
    "SQLAlchemy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/ShamimurRahmanShuvo/user_registration"
Repository = "https://github.com/ShamimurRahmanShuvo/user_registration"
Issues = "https://github.com/ShamimurRahmanShuvo/user_registration/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/user_registration"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
