name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --ignore=tests/integration \
            --cov=user_registration \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90

      - name: Run mypy
        run: |
          python -m mypy src

      - name: Run Ruff lint
        run: |
          python -m ruff check src tests

      - name: Check Ruff formatting
        run: |
          python -m ruff format --check src tests


  fastapi:
    name: FastAPI integration

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/fastapi/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Install FastAPI adapter
        run: |
          python -m pip install -e "./adapters/fastapi[dev]"

      - name: Run FastAPI integration tests
        run: |
          python -m pytest \
            tests/integration/test_fastapi_registration.py \
            -v


  sqlalchemy:
    name: SQLAlchemy integration

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/sqlalchemy/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Install SQLAlchemy adapter
        run: |
          python -m pip install -e "./adapters/sqlalchemy[dev]"

      - name: Run SQLAlchemy integration tests
        run: |
          python -m pytest \
            tests/integration/test_sqlalchemy_repository.py \
            -v


  build:
    name: Build and validate distributions

    runs-on: ubuntu-latest

    needs:
      - core
      - fastapi
      - sqlalchemy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/fastapi/pyproject.toml
            adapters/sqlalchemy/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build tools
        run: |
          python -m pip install build twine

      - name: Prepare distribution directory
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Build core package
        run: |
          python -m build --outdir dist .

      - name: Build FastAPI adapter
        run: |
          python -m build --outdir dist adapters/fastapi

      - name: Build SQLAlchemy adapter
        run: |
          python -m build --outdir dist adapters/sqlalchemy

      - name: List distributions
        run: |
          ls -lah dist

      - name: Validate artifact count
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6

      - name: Validate package metadata
        run: |
          python -m twine check dist/*

      - name: Verify package versions
        run: |
          python - <<'PY'
          import glob
          import re
          import sys

          expected_version = "0.1.3"

          artifacts = glob.glob("dist/*")

          if len(artifacts) != 6:
              print(f"Expected 6 artifacts, found {len(artifacts)}")
              sys.exit(1)

          for artifact in artifacts:
              filename = artifact.rsplit("/", 1)[-1]

              if expected_version not in filename:
                  print(
                      f"Unexpected version in artifact: {filename}"
                  )
                  sys.exit(1)

          print(f"All artifacts use version {expected_version}")
          PY

      - name: Create clean wheel test environment
        run: |
          python -m venv /tmp/release-test-venv

      - name: Install core wheel
        run: |
          /tmp/release-test-venv/bin/python -m pip install \
            dist/user_registration-0.1.3-py3-none-any.whl

      - name: Install FastAPI adapter wheel
        run: |
          /tmp/release-test-venv/bin/python -m pip install \
            dist/user_registration_fastapi-0.1.3-py3-none-any.whl

      - name: Install SQLAlchemy adapter wheel
        run: |
          /tmp/release-test-venv/bin/python -m pip install \
            dist/user_registration_sqlalchemy-0.1.3-py3-none-any.whl

      - name: Verify installed distributions
        run: |
          /tmp/release-test-venv/bin/python -m pip check

      - name: Run installed-package smoke test
        run: |
          /tmp/release-test-venv/bin/python - <<'PY'
          import user_registration
          import user_registration_fastapi
          import user_registration_sqlalchemy

          from user_registration import (
              Argon2Hasher,
              generate_token,
          )

          assert user_registration.__version__ == "0.1.3"

          hasher = Argon2Hasher()

          password = "StrongPassword123!"
          password_hash = hasher.hash(password)

          assert password_hash != password
          assert hasher.verify(password, password_hash)
          assert not hasher.verify(
              "WrongPassword123!",
              password_hash,
          )

          token = generate_token()

          assert isinstance(token, str)
          assert token

          print("Installed package smoke test: PASS")
          PY

      - name: Upload all distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error