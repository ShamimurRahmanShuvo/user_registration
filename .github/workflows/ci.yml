name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  core:
    name: Core - Python ${{ matrix.python-version }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/unit -v

      - name: Run mypy
        run: |
          python -m mypy src

      - name: Run Ruff lint
        run: |
          python -m ruff check src tests

      - name: Check Ruff formatting
        run: |
          python -m ruff format --check src tests


  fastapi:
    name: FastAPI integration

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/fastapi/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Install FastAPI adapter
        run: |
          python -m pip install -e "./adapters/fastapi[dev]"

      - name: Run FastAPI integration tests
        run: |
          python -m pytest tests/integration/test_fastapi_registration.py -v


  sqlalchemy:
    name: SQLAlchemy integration

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/sqlalchemy/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Install SQLAlchemy adapter
        run: |
          python -m pip install -e "./adapters/sqlalchemy[dev]"

      - name: Run SQLAlchemy integration tests
        run: |
          python -m pytest tests/integration/test_sqlalchemy_repository.py -v


  build:
    name: Build packages

    runs-on: ubuntu-latest

    needs:
      - core
      - fastapi
      - sqlalchemy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build tools
        run: |
          python -m pip install build twine

      - name: Build core package
        run: |
          python -m build

      - name: Build FastAPI adapter
        run: |
          python -m build --outdir dist-fastapi adapters/fastapi

      - name: Build SQLAlchemy adapter
        run: |
          python -m build --outdir dist-sqlalchemy adapters/sqlalchemy

      - name: Validate core package
        run: |
          python -m twine check dist/*

      - name: Validate FastAPI adapter
        run: |
          python -m twine check dist-fastapi/*

      - name: Validate SQLAlchemy adapter
        run: |
          python -m twine check dist-sqlalchemy/*

      - name: Upload core distributions
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-dist
          path: dist/

      - name: Upload FastAPI distributions
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-fastapi-dist
          path: dist-fastapi/

      - name: Upload SQLAlchemy distributions
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-sqlalchemy-dist
          path: dist-sqlalchemy/