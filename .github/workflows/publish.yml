name: Publish Python Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Verify release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/fastapi/pyproject.toml
            adapters/sqlalchemy/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install core package
        run: |
          python -m pip install -e ".[dev]"

      - name: Install FastAPI adapter
        run: |
          python -m pip install -e "./adapters/fastapi[dev]"

      - name: Install SQLAlchemy adapter
        run: |
          python -m pip install -e "./adapters/sqlalchemy[dev]"

      - name: Run all tests
        run: |
          python -m pytest -v

      - name: Run mypy
        run: |
          python -m mypy src

      - name: Run Ruff
        run: |
          python -m ruff check src tests

      - name: Check Ruff formatting
        run: |
          python -m ruff format --check src tests


  build:
    name: Build release packages

    runs-on: ubuntu-latest

    needs:
      - test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build tools
        run: |
          python -m pip install build twine

      - name: Build core package
        run: |
          python -m build --outdir dist/core

      - name: Build FastAPI adapter
        run: |
          python -m build --outdir dist/fastapi adapters/fastapi

      - name: Build SQLAlchemy adapter
        run: |
          python -m build --outdir dist/sqlalchemy adapters/sqlalchemy

      - name: Validate core package
        run: |
          python -m twine check dist/core/*

      - name: Validate FastAPI package
        run: |
          python -m twine check dist/fastapi/*

      - name: Validate SQLAlchemy package
        run: |
          python -m twine check dist/sqlalchemy/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/


  publish:
    name: Publish to PyPI

    runs-on: ubuntu-latest

    needs:
      - build

    environment:
      name: pypi
      url: https://pypi.org/

    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/