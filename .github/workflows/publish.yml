name: Publish Python Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read


jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            adapters/fastapi/pyproject.toml
            adapters/sqlalchemy/pyproject.toml

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install build tools
        run: |
          python -m pip install \
            build \
            twine

      - name: Read release version
        id: versions
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version_file = Path(
              "src/user_registration/_version.py"
          )

          content = version_file.read_text(
              encoding="utf-8"
          )

          match = re.search(
              r'^__version__\s*=\s*["\']([^"\']+)["\']',
              content,
              re.MULTILINE,
          )

          if match is None:
              raise SystemExit(
                  "Could not find __version__ in "
                  "src/user_registration/_version.py"
              )

          version = match.group(1)

          print(f"Release version: {version}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8",
          ) as output:
              output.write(f"version={version}\n")
          PY

      - name: Validate synchronized versions
        run: |
          python scripts/check_versions.py

      - name: Verify tag version
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          echo "Git tag version: ${TAG_VERSION}"
          echo "Package version: ${RELEASE_VERSION}"

          if [ "${TAG_VERSION}" != "${RELEASE_VERSION}" ]; then
            echo "ERROR: Git tag does not match package version."
            exit 1
          fi

      - name: Prepare distribution directory
        run: |
          rm -rf dist
          mkdir -p dist

      - name: Build core package
        run: |
          python -m build \
            --outdir dist \
            .

      - name: Build FastAPI adapter
        run: |
          python -m build \
            --outdir dist \
            adapters/fastapi

      - name: Build SQLAlchemy adapter
        run: |
          python -m build \
            --outdir dist \
            adapters/sqlalchemy

      - name: List release artifacts
        run: |
          ls -lah dist

      - name: Verify artifact count
        run: |
          count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"

          echo "Artifact count: ${count}"

          if [ "${count}" -ne 6 ]; then
            echo "ERROR: Expected exactly 6 release artifacts."
            exit 1
          fi

      - name: Validate package metadata
        run: |
          python -m twine check dist/*

      - name: Verify artifact versions
        env:
          RELEASE_VERSION: ${{ steps.versions.outputs.version }}
        run: |
          for artifact in dist/*; do
            filename="$(basename "$artifact")"

            echo "Checking ${filename}"

            if [[ "${filename}" != *"${RELEASE_VERSION}"* ]]; then
              echo "ERROR: Version mismatch in ${filename}"
              exit 1
            fi
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error


  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest

    needs:
      - validate

    environment:
      name: pypi

    permissions:
      id-token: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          name: release-distributions
          path: dist

      - name: Verify downloaded artifacts
        run: |
          ls -lah dist

          count="$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')"

          echo "Artifact count: ${count}"

          if [ "${count}" -ne 6 ]; then
            echo "ERROR: Expected exactly 6 release artifacts."
            exit 1
          fi

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
